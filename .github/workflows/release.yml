name: Release Apps (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --ignore-scripts

      - name: 🔨 Build Web Assets
        run: npm run build

      - name: 🔄 Sync Web Assets to Android
        run: node scripts/sync_assets.js

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📁 Prepare APK Artifacts
        run: |
          mkdir -p apk_dist
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_dist/pharmacy-employee-portal.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_dist/بوابة_الموظف.apk

      - name: 📤 Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk_dist/*.apk

  build-windows:
    name: 💻 Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --ignore-scripts

      - name: 🔨 Build Web Assets for Electron
        run: npm run build:electron

      - name: ⚙️ Build Windows Installer (.exe)
        run: npx electron-builder --win --publish never

      - name: 📤 Upload Windows App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

  publish-release:
    name: 🚀 Publish Unified Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Android APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: unified-release

      - name: 📥 Download Windows Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: unified-release

      - name: 📋 List Release Assets
        run: ls -lh unified-release/

      - name: 🚀 Publish Unified Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: unified-release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          name: "منظومة الموارد البشرية وبوابة الموظف - ${{ github.ref_name }}"
