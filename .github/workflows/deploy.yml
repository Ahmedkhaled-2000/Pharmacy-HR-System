name: Build & Auto-Deploy to Apex Thunder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Vite Production Bundle
        run: npm run build

      - name: 📁 Prepare Deployment Files
        run: |
          rm -rf deploy_package
          mkdir -p deploy_package
          cp -r dist/* deploy_package/
          cp -r api deploy_package/api
          if [ -f public/.htaccess ]; then
            cp public/.htaccess deploy_package/.htaccess
          fi

      - name: 🚀 Sync & Deploy to Hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '13.140.142.42' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: deploy_package/
          dangerous-clean-slate: true
          timeout: 180000
          exclude: |
            **/.git*
            **/.git*/**
            **/.ftpquota
            **/node_modules/**
            **/*.sqlite*
            **/uploads/**
